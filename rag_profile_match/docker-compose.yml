services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API
      # - "6334:6334"   # gRPC (optional but useful)
    volumes:
      - qdrant_storage:/qdrant/storage
    # Optional: if you want to set an API key for local dev
    # environment:
    #   QDRANT__SERVICE__API_KEY: "dev-api-key"
    restart: on-failure:5

volumes:
  qdrant_storage: