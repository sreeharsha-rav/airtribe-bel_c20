services:
  db:
    image: postgres:16-alpine
    container_name: teamboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-teamboard}
      POSTGRES_USER: ${DB_USER:-teamboard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-teamboard}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - teamboard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-teamboard} -d ${DB_NAME:-teamboard}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  teamboard_postgres_data:
