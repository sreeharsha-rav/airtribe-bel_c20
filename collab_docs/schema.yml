components:
  schemas:
    ActionEnum:
      enum:
      - created
      - updated
      type: string
      description: |-
        * `created` - Created
        * `updated` - Updated
    AddDocumentTags:
      type: object
      description: Request body for POST /api/documents/{id}/tags/.
      properties:
        tag_names:
          type: array
          items:
            type: string
            maxLength: 100
      required:
      - tag_names
    AddWorkspaceMember:
      type: object
      description: |-
        Request/response body for POST /api/workspaces/{id}/members/.
        workspace is set by the view from the URL, not accepted from the body.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/RoleEnum'
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - joined_at
      - role
      - user
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        model_name:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - id
      - model_name
      - object_id
      - timestamp
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        document:
          type: string
          format: uuid
        author:
          type: string
          format: uuid
          nullable: true
        content:
          type: string
        parent:
          type: string
          format: uuid
          nullable: true
        reply_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - document
      - id
      - reply_count
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        content:
          type: string
        workspace:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - id
      - title
      - updated_at
      - workspace
    DocumentStats:
      type: object
      description: Response shape for GET /api/documents/{id}/stats/.
      properties:
        version_count:
          type: integer
        comment_count:
          type: integer
        contributor_count:
          type: integer
      required:
      - comment_count
      - contributor_count
      - version_count
    DocumentVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        document:
          type: string
          format: uuid
        content:
          type: string
        version_number:
          type: integer
          readOnly: true
        saved_by:
          type: string
          format: uuid
          nullable: true
        saved_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - document
      - id
      - saved_at
      - version_number
    PatchedComment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        document:
          type: string
          format: uuid
        author:
          type: string
          format: uuid
          nullable: true
        content:
          type: string
        parent:
          type: string
          format: uuid
          nullable: true
        reply_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        content:
          type: string
        workspace:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedTag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        documents:
          type: array
          items:
            type: string
            format: uuid
        document_count:
          type: integer
          readOnly: true
    PatchedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        email:
          type: string
          maxLength: 254
        phone:
          type: string
          maxLength: 15
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedWorkspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        owner:
          type: string
          format: uuid
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
    RoleEnum:
      enum:
      - admin
      - editor
      - viewer
      type: string
      description: |-
        * `admin` - Admin
        * `editor` - Editor
        * `viewer` - Viewer
    StatusEnum:
      enum:
      - draft
      - published
      - archived
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `archived` - Archived
    Tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        documents:
          type: array
          items:
            type: string
            format: uuid
        document_count:
          type: integer
          readOnly: true
      required:
      - document_count
      - id
      - name
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        email:
          type: string
          maxLength: 254
        phone:
          type: string
          maxLength: 15
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - first_name
      - id
      - last_name
      - phone
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        owner:
          type: string
          format: uuid
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - owner
    WorkspaceDetail:
      type: object
      description: |-
        Used for the annotated retrieve() response; member_count comes from
        an annotate(member_count=Count('members')) on the queryset.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        owner:
          type: string
          format: uuid
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        member_count:
          type: integer
          readOnly: true
      required:
      - created_at
      - id
      - member_count
      - name
      - owner
    WorkspaceMemberDetail:
      type: object
      description: |-
        Response shape for GET /api/workspaces/{id}/members/ — nests the
        member's user details instead of just exposing a raw FK id.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - joined_at
      - role
      - user
    WorkspaceSummary:
      type: object
      description: Response shape for GET /api/workspaces/{id}/summary/.
      properties:
        document_count:
          type: integer
        member_count:
          type: integer
        comment_count:
          type: integer
      required:
      - comment_count
      - document_count
      - member_count
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Users
  description: Create and look up users.
- name: Workspaces
  description: Workspaces, membership, and summary stats.
- name: Documents
  description: Documents, versions, and per-document stats.
- name: Comments
  description: Threaded comments on documents.
- name: Tags
  description: Tags and their document associations.
- name: Audit Logs
  description: Read-only log of document create/update actions.
