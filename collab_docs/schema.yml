openapi: 3.0.3
info:
  title: Collab Docs API
  version: 1.0.0
  description: Collab Docs API.Users can create workspaces, invite collaborators,
    write and version documents, leave comments, and control access with role-based
    permissions.
paths:
  /api/audit-logs/:
    get:
      operationId: audit_logs_list
      description: Filter with ?actor={id}&date_from=...&date_to=...
      summary: List audit logs
      parameters:
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
        description: Filter by actor (user) id
      - in: query
        name: date_from
        schema:
          type: string
          format: date-time
        description: Only entries at/after this timestamp
      - in: query
        name: date_to
        schema:
          type: string
          format: date-time
        description: Only entries at/before this timestamp
      tags:
      - Audit Logs
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/audit-logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      summary: Get an audit log entry by id
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this audit log.
        required: true
      tags:
      - Audit Logs
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/comments/:
    get:
      operationId: comments_list
      description: Filter with ?document={id} to get a document's threaded comments.
      summary: List comments
      parameters:
      - in: query
        name: document
        schema:
          type: string
          format: uuid
        description: Filter by document id
      tags:
      - Comments
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
          description: ''
    post:
      operationId: comments_create
      summary: Add a top-level comment or a reply
      tags:
      - Comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
            examples:
              Top-levelComment:
                value:
                  document: 33333333-3333-3333-3333-333333333333
                  author: 22222222-2222-2222-2222-222222222222
                  content: Looks good overall.
                summary: Top-level comment
              ReplyToAComment:
                value:
                  document: 33333333-3333-3333-3333-333333333333
                  author: 11111111-1111-1111-1111-111111111111
                  content: Agreed, nice catch.
                  parent: 44444444-4444-4444-4444-444444444444
                summary: Reply to a comment
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Comment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Comment'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
  /api/comments/{id}/:
    get:
      operationId: comments_retrieve
      summary: Get a comment by id
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this comment.
        required: true
      tags:
      - Comments
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
    put:
      operationId: comments_update
      summary: Replace a comment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this comment.
        required: true
      tags:
      - Comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Comment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Comment'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
    patch:
      operationId: comments_partial_update
      summary: Partially update a comment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this comment.
        required: true
      tags:
      - Comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedComment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedComment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedComment'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
    delete:
      operationId: comments_destroy
      summary: Delete a comment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this comment.
        required: true
      tags:
      - Comments
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/documents/:
    get:
      operationId: documents_list
      description: Supports filtering by workspace, status, tag name, and a title
        search.
      summary: List documents
      parameters:
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive title/content search
      - in: query
        name: status
        schema:
          type: string
        description: Filter by document status
      - in: query
        name: tag
        schema:
          type: string
        description: Filter by tag name(s), comma-separated
      - in: query
        name: workspace
        schema:
          type: string
          format: uuid
        description: Filter by workspace id
      tags:
      - Documents
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
          description: ''
    post:
      operationId: documents_create
      summary: Create a document + its first version
      tags:
      - Documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Document'
            examples:
              CreateDocument:
                value:
                  title: Q3 Roadmap
                  content: Initial draft of the roadmap.
                  workspace: 11111111-1111-1111-1111-111111111111
                  created_by: 22222222-2222-2222-2222-222222222222
                  status: draft
                summary: Create document
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Document'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Document'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
  /api/documents/{id}/:
    get:
      operationId: documents_retrieve
      summary: Get a document by id
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document.
        required: true
      tags:
      - Documents
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
    put:
      operationId: documents_update
      summary: Update a document, saving a new version
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document.
        required: true
      tags:
      - Documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Document'
            examples:
              UpdateDocument:
                value:
                  title: Q3 Roadmap
                  content: Revised draft after review.
                  workspace: 11111111-1111-1111-1111-111111111111
                  created_by: 22222222-2222-2222-2222-222222222222
                  status: published
                summary: Update document
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Document'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Document'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
    patch:
      operationId: documents_partial_update
      summary: Partially update a document, saving a new version
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document.
        required: true
      tags:
      - Documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDocument'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDocument'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDocument'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
    delete:
      operationId: documents_destroy
      summary: Delete a document
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document.
        required: true
      tags:
      - Documents
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/documents/{id}/stats/:
    get:
