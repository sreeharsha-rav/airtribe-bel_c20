  /api/documents/{id}/tags/:
    post:
      operationId: documents_tags_create
      summary: Add one or more tags to a document
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document.
        required: true
      tags:
      - Documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocumentTags'
            examples:
              AddTags:
                value:
                  tag_names:
                  - python
                  - backend
                summary: Add tags
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddDocumentTags'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddDocumentTags'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
          description: ''
  /api/documents/{id}/versions/:
    get:
