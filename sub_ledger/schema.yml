        their own try/except around service calls.
      summary: List plans
      tags:
      - Plans
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
          description: ''
    post:
      operationId: plans_create
      description: |-
        Base for every billing view.

        Translates domain exceptions raised by the service layer into the HTTP
        status they map to, so individual views only need to parse the request,
        call one service method, and serialize the result — they never need
        their own try/except around service calls.
      summary: Create a plan
      tags:
      - Plans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlanCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlanCreate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
          description: ''
  /api/plans/{plan_id}:
    patch:
      operationId: plans_partial_update
      description: |-
        Base for every billing view.

        Translates domain exceptions raised by the service layer into the HTTP
        status they map to, so individual views only need to parse the request,
        call one service method, and serialize the result — they never need
        their own try/except around service calls.
      summary: Update or deactivate a plan
      parameters:
      - in: path
        name: plan_id
        schema:
          type: integer
        required: true
      tags:
      - Plans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPlanUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPlanUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPlanUpdate'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
