  /api/subscriptions:
    get:
      operationId: subscriptions_list
      description: |-
        Base for every billing view.

        Translates domain exceptions raised by the service layer into the HTTP
        status they map to, so individual views only need to parse the request,
        call one service method, and serialize the result — they never need
        their own try/except around service calls.
      summary: List subscriptions
      tags:
      - Subscriptions
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscription'
          description: ''
    post:
      operationId: subscriptions_create
      description: |-
        Base for every billing view.

        Translates domain exceptions raised by the service layer into the HTTP
        status they map to, so individual views only need to parse the request,
        call one service method, and serialize the result — they never need
        their own try/except around service calls.
      summary: Create a subscription
      tags:
      - Subscriptions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
  /api/subscriptions/{subscription_id}/cancel:
    patch:
      operationId: subscriptions_cancel_partial_update
      description: |-
        Base for every billing view.

        Translates domain exceptions raised by the service layer into the HTTP
        status they map to, so individual views only need to parse the request,
        call one service method, and serialize the result — they never need
        their own try/except around service calls.
      summary: Cancel a subscription
      parameters:
      - in: path
        name: subscription_id
        schema:
          type: integer
        required: true
      tags:
      - Subscriptions
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
components:
  schemas:
    ActivationStatusEnum:
      enum:
      - active
      - inactive
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
    BillingCycleEnum:
      enum:
      - monthly
      - quarterly
      - yearly
      - custom
      type: string
      description: |-
        * `monthly` - Monthly
        * `quarterly` - Quarterly
        * `yearly` - Yearly
        * `custom` - Custom
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        company_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ActivationStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company_name
      - created_at
      - email
      - id
      - name
      - status
    CustomerCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        company_name:
          type: string
          default: ''
          maxLength: 255
      required:
      - email
      - name
    Invoice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        subscription_id:
          type: integer
          readOnly: true
        customer_id:
          type: integer
          readOnly: true
        amount_due:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        amount_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/InvoiceStatusEnum'
          readOnly: true
        period_start:
          type: string
          format: date-time
          readOnly: true
        period_end:
          type: string
          format: date-time
          readOnly: true
        due_date:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount_due
      - amount_paid
      - created_at
      - currency
      - customer_id
      - due_date
      - id
      - period_end
      - period_start
      - status
      - subscription_id
    InvoiceGenerate:
      type: object
      properties:
        subscription_id:
          type: integer
          minimum: 1
      required:
      - subscription_id
    InvoiceStatusEnum:
      enum:
      - draft
      - issued
      - partially_paid
      - paid
      - overdue
      - void
      type: string
      description: |-
        * `draft` - Draft
        * `issued` - Issued
        * `partially_paid` - Partially Paid
        * `paid` - Paid
        * `overdue` - Overdue
        * `void` - Void
    LedgerEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer_id:
          type: integer
          readOnly: true
        invoice_id:
          type: integer
          readOnly: true
        entry_type:
          allOf:
          - $ref: '#/components/schemas/LedgerEntryTypeEnum'
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        reference_id:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - currency
      - customer_id
      - description
      - entry_type
      - id
      - invoice_id
      - reference_id
    LedgerEntryTypeEnum:
      enum:
      - invoice_created
      - payment_success
      - payment_failure
      type: string
      description: |-
        * `invoice_created` - Invoice Created
        * `payment_success` - Payment Success
        * `payment_failure` - Payment Failure
    PatchedPlanUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
        billing_cycle:
          $ref: '#/components/schemas/BillingCycleEnum'
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
          maxLength: 3
        status:
          $ref: '#/components/schemas/ActivationStatusEnum'
    PaymentAttempt:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        invoice_id:
          type: integer
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentAttemptStatusEnum'
          readOnly: true
        provider_reference:
          type: string
          readOnly: true
        failure_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - currency
      - failure_reason
      - id
      - invoice_id
      - provider_reference
      - status
    PaymentAttemptStatusEnum:
      enum:
      - success
      - failed
      type: string
      description: |-
        * `success` - Success
        * `failed` - Failed
    PaymentRecord:
      type: object
      properties:
        invoice_id:
          type: integer
          minimum: 1
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
          maxLength: 3
        status:
          $ref: '#/components/schemas/PaymentAttemptStatusEnum'
        provider_reference:
          type: string
          default: ''
          maxLength: 255
        failure_reason:
          type: string
          default: ''
          maxLength: 255
      required:
      - amount
      - currency
      - invoice_id
      - status
    PaymentRecordResponse:
      type: object
      properties:
        payment_attempt:
          $ref: '#/components/schemas/PaymentAttempt'
        invoice:
          $ref: '#/components/schemas/Invoice'
      required:
      - invoice
      - payment_attempt
    Plan:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        billing_cycle:
          allOf:
          - $ref: '#/components/schemas/BillingCycleEnum'
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ActivationStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - billing_cycle
      - created_at
      - currency
      - description
      - id
      - name
      - price
      - status
      - updated_at
    PlanCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          default: ''
        billing_cycle:
          $ref: '#/components/schemas/BillingCycleEnum'
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
          default: USD
          maxLength: 3
      required:
      - billing_cycle
      - name
      - price
    Subscription:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer_id:
          type: integer
          readOnly: true
        plan_id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SubscriptionStatusEnum'
          readOnly: true
        start_date:
          type: string
          format: date-time
          readOnly: true
        current_period_start:
          type: string
          format: date-time
          readOnly: true
        current_period_end:
          type: string
          format: date-time
          readOnly: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - cancelled_at
      - current_period_end
      - current_period_start
      - customer_id
      - id
      - plan_id
      - start_date
      - status
    SubscriptionCreate:
      type: object
      properties:
        customer_id:
          type: integer
          minimum: 1
        plan_id:
          type: integer
          minimum: 1
        custom_period_length:
          type: string
          nullable: true
      required:
      - customer_id
      - plan_id
    SubscriptionStatusEnum:
      enum:
      - active
      - cancelled
      type: string
      description: |-
        * `active` - Active
        * `cancelled` - Cancelled
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
tags:
- name: Plans
  description: Create, update, deactivate, and list subscription plans.
- name: Customers
  description: Create and look up customers.
- name: Subscriptions
  description: Create, cancel, and list customer subscriptions.
- name: Invoices
  description: Generate invoices and fetch invoice details.
- name: Payments
  description: Record payment attempts against invoices.
- name: Ledger
  description: Read-only, append-only ledger history per customer.
