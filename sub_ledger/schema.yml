openapi: 3.0.3
info:
  title: SubLedger API
  version: 1.0.0
  description: SubLedger — a simplified SaaS subscription & billing backend. Manages
    plans, customers, subscriptions, invoices, payments, and an append-only ledger.
paths:
  /api/customers:
    get:
      operationId: customers_list
      description: |-
        Base for every billing view.

        Translates domain exceptions raised by the service layer into the HTTP
        status they map to, so individual views only need to parse the request,
        call one service method, and serialize the result — they never need
        their own try/except around service calls.
      summary: List customers
      tags:
      - Customers
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
          description: ''
    post:
      operationId: customers_create
      description: |-
        Base for every billing view.

        Translates domain exceptions raised by the service layer into the HTTP
        status they map to, so individual views only need to parse the request,
        call one service method, and serialize the result — they never need
        their own try/except around service calls.
      summary: Create a customer
      tags:
      - Customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/customers/{customer_id}:
    get:
      operationId: customers_retrieve
      description: |-
        Base for every billing view.

        Translates domain exceptions raised by the service layer into the HTTP
        status they map to, so individual views only need to parse the request,
        call one service method, and serialize the result — they never need
        their own try/except around service calls.
      summary: Fetch customer details
      parameters:
      - in: path
        name: customer_id
        schema:
          type: integer
        required: true
      tags:
      - Customers
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/customers/{customer_id}/ledger:
    get:
      operationId: customers_ledger_list
      description: |-
        Base for every billing view.

        Translates domain exceptions raised by the service layer into the HTTP
        status they map to, so individual views only need to parse the request,
        call one service method, and serialize the result — they never need
        their own try/except around service calls.
      summary: Fetch customer ledger history
      parameters:
      - in: path
        name: customer_id
        schema:
          type: integer
        required: true
      tags:
      - Ledger
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerEntry'
          description: ''
  /api/invoices/{invoice_id}:
    get:
      operationId: invoices_retrieve
      description: |-
        Base for every billing view.

        Translates domain exceptions raised by the service layer into the HTTP
        status they map to, so individual views only need to parse the request,
        call one service method, and serialize the result — they never need
        their own try/except around service calls.
      summary: Fetch invoice details
      parameters:
      - in: path
        name: invoice_id
        schema:
          type: integer
        required: true
      tags:
      - Invoices
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
          description: ''
  /api/invoices/generate:
    post:
      operationId: invoices_generate_create
      description: |-
        Base for every billing view.

        Translates domain exceptions raised by the service layer into the HTTP
        status they map to, so individual views only need to parse the request,
        call one service method, and serialize the result — they never need
        their own try/except around service calls.
      summary: Generate an invoice for a subscription
      tags:
      - Invoices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceGenerate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvoiceGenerate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvoiceGenerate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
          description: ''
  /api/payments/record:
    post:
      operationId: payments_record_create
      description: |-
        Base for every billing view.

        Translates domain exceptions raised by the service layer into the HTTP
        status they map to, so individual views only need to parse the request,
        call one service method, and serialize the result — they never need
        their own try/except around service calls.
      summary: Record a payment attempt
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRecord'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentRecord'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRecord'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRecordResponse'
          description: ''
  /api/plans:
    get:
      operationId: plans_list
      description: |-
        Base for every billing view.

        Translates domain exceptions raised by the service layer into the HTTP
        status they map to, so individual views only need to parse the request,
