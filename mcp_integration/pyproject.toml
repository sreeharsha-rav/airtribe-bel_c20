[project]
name = "mcp-integration"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.5",
    "langchain>=1.3.16",
    "langchain-openrouter>=0.2.8",
    "pydantic>=2.12.5",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.2",
    "python-docx>=1.2.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
